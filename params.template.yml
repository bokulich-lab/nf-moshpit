# ========= MANDATORY INPUTS =========
# A unique identifier for the workflow run - will be prepended to all artifact names
runId: EXAMPLE

# Path to where all the outputs will be saved
outputDir: /path/to/output

# Singularity parameters: path to the SIF image, additional volume mounts and other options
container: /path/to/container.sif
# Optional per-plugin overrides (default to container when unset)
containerAnnotate: /path/to/annotate.sif
containerAssembly: /path/to/assembly.sif
containerMag: /path/to/mag.sif
containerCheckM: /path/to/checkm.sif
containerSkani: /path/to/skani.sif
containerSourmash: /path/to/sourmash.sif
containerHumann3: /path/to/humann3.sif
containerFastp: /path/to/fastp.sif
additionalVolumeMounts: "additional volumes to be mounted in the containers"
additionalContainerOptions: "additional options to be passed to Singularity"

# Name of the HPC module granting Internet access
internetModule: module_name

# Path to the conda environment
condaEnv: /path/to/conda/env

# E-mail address required by q2-fondue
email: user@example.com

# Archive the per-sample caches upon completion
archive: true

retain:
  input: true
  subsampling: true
  fastp: true
  host_removal: true

# ============ INPUT DATA ============
# Option 1: import reads using a manifest file
inputReadsManifest: /path/to/manifest

# Option 2: provide a key to an existing reads artifact
inputReads: <reads cache key>
inputReadsCache: /path/to/reads/
metadata: /path/to/metadata

# Option 3: provide a file with a list of IDs for fondue to fetch
fondueAccessionIds: /path/to/tsv

# Option 4: provide a path to genomes from which the reads should be simulated
# If the path is not specified, a random selection of genomes will be fetched from NCBI
read_simulation:
  samples: /path/to/samples.tsv
  seed: 100
  clusterOptions: ""

# ============= DATABASES =============
databases:
  hostRemoval:
    cache:  ""
    key:    ""
  kraken2:
    cache:  ""
    key:    ""
    fetchCollection: ""
  bracken:
    cache:  ""
    key:    ""
  kaiju:
    cache:  ""
    key:    ""
    databaseType: ""
  busco:
    cache:  ""
    key:    ""
    fetchLineages: ""
  checkm:
    path: ""
  eggnogOrthologs:
    cache:  ""
    key:    ""
  eggnogAnnotations:
    cache:  ""
    key:    ""
  humann3Chocophlan:
    cache:  ""
    key:    ""
  humann3TranslatedSearch:
    cache:  ""
    key:    ""
    build: "uniref90_diamond"
  humann3Metaphlan:
    cache:  ""
    key:    ""
    index: "latest"
    cpus: 1

# ======== ANALYSIS PARAMETERS ========
fondue:
  paired: true
  clusterOptions: ""

read_subsampling:
  enabled: false
  paired: true
  fraction: 0.8

read_qc:
  fastp:
    disableQualityFiltering: false
    deduplicate: false
    disableAdapterTrimming: true
    enableBaseCorrection: true
    additionalFlags: ""

host_removal:
  enabled: false
  human: true
  clusterOptions: ""
  mode: "local"
  sensitivity: "sensitive"
  ref_gap_open_penalty: 5
  ref_gap_ext_penalty: 3

sample_filtering:
  enabled: false
  min_reads: 4200000

genome_assembly:
  enabled: true
  clusterOptions: ""
  assembler: "megahit"
  fetchArtifact: false
  megahit:
    presets: "meta-large"
    kList: "21 29 39 59 79 99 119 141"
    minContigLen: 200
    additionalFlags: ""
  spades:
    k: "auto"
    debug: false
    covCutoff: "off"
    additionalFlags: "--p-meta"
  filtering:
    enabled: true
    removeEmpty: true
    lengthThreshold: 500

assembly_qc:
  enabled: true
  quast:
    enabled: false
    useMappedReads: false
    additionalFlags: ""

binning:
  enabled: true
  primary: metabat2
  fetchArtifact: false
  metabat2:
    enabled: true
    clusterOptions: ""
    min_contig: 1500
    seed: 100
    additionalFlags: ""
  semibin2:
    enabled: false
    clusterOptions: ""
    environment: global
    training_type: semi
    min_len: 1500
    epochs: 15
    batch_size: 2048
    random_seed: 100
    additionalFlags: ""
  qc:
    busco:
      enabled: false
      clusterOptions: ""
      mode: "genome"
      lineageDatasets: "bacteria_odb12"
      selectLineage: "bacteria_odb12"
      additionalFlags: ""
      cleanUp: false
      fetchArtifact: false
    checkm:
      enabled: false
      reducedTree: false
      clusterOptions: ""
      additionalFlags: ""
    filtering:
      enabled: false
      condition: "complete>50 AND dataset='bacteria_odb12'"
      exclude_ids: false
      fetchArtifact: false

dereplication:
  enabled: true
  method: "sourmash" # sourmash, skani
  clusterOptions: ""
  threshold: 0.99
  fetchArtifact: false
  sourmash:
    clusterOptions: ""
    ksizes: 35
    scaled: 100
    trackAbundance: true
  skani:
    clusterOptions: ""
    preset: "slow"
    markerC: 1000
    robust: true
    median: false
    fasterSmall: false
    additionalFlags: ""

abundance_estimation:
  enabledFor: "derep" # contigs, derep
  fetchArtifact: false
  metric: "tpm"
  min_mapq: 42
  min_query_len: 0
  min_base_quality: 0

taxonomic_classification:
  enabledFor: "derep" # reads, contigs, mags, derep
  fetchArtifact: false # this will fetch the taxonomies and feature tables at either of the classification steps, if available
  kraken2:
    clusterOptions: ""
    memoryMapping: false
    additionalFlags: ""
    fetchArtifact: false # this will fetch the Kraken2 reports and hits
  bracken:
    enabled: true
    clusterOptions: ""
    threshold: 0
    readLength: 100
    level: "S"
    fetchArtifact: false # this will fetch the Bracken-corrected reports
  feature_selection:
    coverageThreshold: 0.1
  kaiju:
    enabledFor: "reads" # reads, contigs
    a:  "greedy"
    evalue: 1e-05
    m:  11
    r: "species"
    c: 0.0
    u: true
    clusterOptions: ""
    additionalFlags: ""

functional_annotation:
  enabledFor: "" # contigs, mags, derep
  ortholog_search:
    clusterOptions: ""
    fetchArtifact: false
    dbInMemory: true
    additionalFlags: ""
  annotation:
    clusterOptions: ""
    fetchArtifact: false
    dbInMemory: true
    additionalFlags: ""
    extract:
      types: "caz,cog"
      max_evalue: 0.00001
      min_score: 0
      fetchArtifact: false
  cleanUp: false
  partitionBatchCount: 10

humann3:
  enabled: false
  clusterOptions: ""
  fetchArtifact: false
  memory_use: "minimum" # minimum, maximum
  prescreen_threshold: 0.01
  nucleotide_identity_threshold: 0.0
  nucleotide_query_coverage_threshold: 90.0
  nucleotide_subject_coverage_threshold: 50.0
  translated_identity_threshold: null
  translated_query_coverage_threshold: 90.0
  translated_subject_coverage_threshold: 50.0
  evalue: 1.0
  gap_fill: true
  minpath: true
  pathways: "metacyc" # metacyc, unipathway
  output_max_decimals: 10
  log_level: "INFO"
  additionalFlags: ""
  conversion:
    destratify: false
    metaphlan_level: 7
    additionalFlags: ""

weblog:
  enabled: false
  url: ""
  basicToken: ""

env:
  NUMBA_DISABLE_INTEL_SVML: 1 